---
version: "3"

vars:
  TF_ROOTS:
    sh: find terraform -maxdepth 2 -name '*.tf' -printf '%h\n' 2>/dev/null | sort -u

tasks:
  default:
    cmds:
      - task -l
    silent: true

  lint:
    desc: Run pre-commit across all files
    cmds:
      - pre-commit run --all-files

  test:
    desc: terraform validate across every root module
    cmds:
      - task: tf:validate

  docs:
    desc: Build the MkDocs site (strict)
    cmds:
      - mkdocs build --strict

  tf:fmt:
    desc: terraform fmt -recursive terraform/
    cmds:
      - terraform fmt -recursive terraform/

  tf:validate:
    desc: terraform init -backend=false && validate per root module
    cmds:
      - |
        set -euo pipefail
        for root in $(find terraform -maxdepth 2 -name '*.tf' -printf '%h\n' | sort -u); do
          echo "==> $root"
          terraform -chdir="$root" init -backend=false -input=false -no-color
          terraform -chdir="$root" validate -no-color
        done

  tf:plan:
    desc: terraform plan for the repos root module (requires GITHUB_TOKEN with `repo` scope; plus TF_VAR_portfolio_app_id — `source scripts/portfolio-app-env.sh` — when a ruleset sets bypass_portfolio_app)
    cmds:
      - terraform -chdir=terraform/repos init -input=false
      - terraform -chdir=terraform/repos plan

  tf:apply:
    desc: terraform apply for the repos root module (human-gated; same env prerequisites as tf:plan)
    cmds:
      - terraform -chdir=terraform/repos init -input=false
      - terraform -chdir=terraform/repos apply

  tf:plan:portfolio-app:
    desc: terraform plan for the portfolio-app root module (requires TF_VAR_app_id, TF_VAR_app_private_key, GITHUB_TOKEN)
    cmds:
      - terraform -chdir=terraform/portfolio-app init -input=false
      - terraform -chdir=terraform/portfolio-app plan

  tf:apply:portfolio-app:
    desc: terraform apply for the portfolio-app root module (human-gated)
    cmds:
      - terraform -chdir=terraform/portfolio-app init -input=false
      - terraform -chdir=terraform/portfolio-app apply

  tf:plan:portfolio-ops:
    desc: terraform plan for the portfolio-ops root module (needs `source scripts/portfolio-ops-env.sh` first)
    cmds:
      - terraform -chdir=terraform/portfolio-ops init -input=false
      - terraform -chdir=terraform/portfolio-ops plan

  tf:apply:portfolio-ops:
    desc: terraform apply for the portfolio-ops root module (human-gated)
    cmds:
      - terraform -chdir=terraform/portfolio-ops init -input=false
      - terraform -chdir=terraform/portfolio-ops apply
