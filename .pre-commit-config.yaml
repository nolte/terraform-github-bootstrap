---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --init-args=-backend=false
      - id: terraform_tflint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yml]

  - repo: local
    hooks:
      - id: vale
        name: vale (task lint:prose)
        entry: task lint:prose
        language: system
        # Always the full prose scope in a single run: a vocabulary or pin change
        # can break unchanged docs, and split parallel runs raced on `vale sync`.
        pass_filenames: false
        files: ^(README\.md|docs/en/.*\.md|\.vale\.ini|\.github/styles/config/vocabularies/.*)$
