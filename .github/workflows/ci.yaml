---
name: ci

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: lint + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: pip install pre-commit
      # Vale for the `vale` pre-commit hook (task lint:prose). Pinned in
      # lock-step with `.tool-versions` and nolte/gh-plumbing's Vale workflows.
      - name: Install Vale
        env:
          VALE_VERSION: "3.15.2"
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - run: task lint
      - run: task test
      - run: task docs
