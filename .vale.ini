StylesPath = ".github/styles"
MinAlertLevel = suggestion

Packages = Microsoft, RedHat, https://github.com/nolte/vale-style/releases/download/v0.1.17/nolte-styles.zip

# `technical` ships with the nolte-styles package; `terraform-github-bootstrap`
# is this repository's own, tracked in git. Both are listed because Vocab
# replaces rather than extends -- naming only the local one would silently drop
# every word the package accepts.
Vocab = technical, terraform-github-bootstrap

IgnoredScopes = code, tt, em

# RedHat is synced but not applied: its Spelling rule fails with
# "E201: unable to resolve dicpath" on Vale 3.15.2 (same in nolte/gh-plumbing).
# nolte-styles ships vocabularies only, consumed through `Vocab` above.
[*.md]
BasedOnStyles = Vale, Microsoft
